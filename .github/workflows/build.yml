name: Build ROS 2 Android libraries

on:
  push:
    branches: [humble]
    # Release tags mirror ros2/ros2's scheme, with a trailing build number for
    # Android-side respins of the same upstream release:
    #   release-humble-20260220-1
    tags: ['release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derives every name and label used below from the tag (on a tag build) or
      # from the .repos pin (on a branch build), so nothing is hardcoded twice.
      - name: Resolve build metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pinned=$(sed -n 's/^# ros2-release:[[:space:]]*//p' ros2_java_android.repos)
          if [ -z "$pinned" ]; then
            echo "::error file=ros2_java_android.repos::missing '# ros2-release:' pin comment"
            exit 1
          fi
          echo "pinned upstream release: $pinned"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^release-([a-z]+)-([0-9]{8})(-([0-9]+))?$ ]]; then
              echo "::error::tag '$tag' does not match release-<distro>-<YYYYMMDD>[-<build>]"
              exit 1
            fi
            distro="${BASH_REMATCH[1]}"
            date="${BASH_REMATCH[2]}"
            build="${BASH_REMATCH[4]:-}"
            upstream="release-${distro}-${date}"

            # Guard against tagging a release the repo file was never synced to.
            if [ "$upstream" != "$pinned" ]; then
              echo "::error::tag targets '$upstream' but ros2_java_android.repos is pinned to '$pinned'"
              exit 1
            fi

            # Reuse upstream's own release title ("... Patch Release 14") rather
            # than trying to derive the patch number from the date.
            upstream_name=$(gh api "repos/ros2/ros2/releases/tags/${upstream}" --jq .name 2>/dev/null || true)
            [ -n "$upstream_name" ] || upstream_name="$upstream"

            # An unsuffixed tag is the normal case and gets clean names; the
            # suffix only appears on Android-side respins of the same upstream
            # release, and then has to show up in the asset names too.
            if [ -n "$build" ]; then
              slug="${distro}-${date}-${build}"
              upstream_name="${upstream_name} (Android build ${build})"
            else
              slug="${distro}-${date}"
            fi

            echo "release=true"             >> "$GITHUB_OUTPUT"
            echo "name=${upstream_name}"    >> "$GITHUB_OUTPUT"
            echo "slug=${slug}"             >> "$GITHUB_OUTPUT"
          else
            distro="${pinned#release-}"; distro="${distro%%-*}"
            upstream="$pinned"
            echo "release=false"                        >> "$GITHUB_OUTPUT"
            echo "slug=${distro}-${GITHUB_SHA::7}"      >> "$GITHUB_OUTPUT"
          fi

          echo "distro=${distro}"     >> "$GITHUB_OUTPUT"
          echo "upstream=${upstream}" >> "$GITHUB_OUTPUT"

          # Read the Android config out of the Dockerfile so release notes can
          # never drift from what was actually built.
          sed -n 's/^ENV ANDROID_NDK_VERSION[[:space:]]\+/ndk=/p'  Dockerfile >> "$GITHUB_OUTPUT"
          sed -n 's/^ENV ANDROID_ABI[[:space:]]\+/abi=/p'          Dockerfile >> "$GITHUB_OUTPUT"
          sed -n 's/^ENV ANDROID_TARGET[[:space:]]\+/api=/p'       Dockerfile >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ros2java-android-build:humble
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workspace
        run: python3 run.py out/soOut out/jarOut

      - name: Package outputs
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          set -euo pipefail
          tar -C out -czf "ros2-android-${SLUG}-soOut.tar.gz" soOut
          tar -C out -czf "ros2-android-${SLUG}-jarOut.tar.gz" jarOut
          sha256sum ros2-android-*.tar.gz | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros2-android-${{ steps.meta.outputs.slug }}
          path: |
            ros2-android-*.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Write release notes
        if: steps.meta.outputs.release == 'true'
        env:
          DISTRO: ${{ steps.meta.outputs.distro }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          NDK: ${{ steps.meta.outputs.ndk }}
          ABI: ${{ steps.meta.outputs.abi }}
          API: ${{ steps.meta.outputs.api }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          Prebuilt [rcljava](https://github.com/ros2-java/ros2_java) libraries for Android,
          built from ROS 2 \`${DISTRO}\` sources.

          ## Upstream

          Package versions match [\`${UPSTREAM}\`](https://github.com/ros2/ros2/releases/tag/${UPSTREAM})
          exactly, except for the \`ros2-java/*\` packages and a small number of
          Android-specific patches (see \`patches/\`).

          ## Build configuration

          | | |
          |---|---|
          | NDK | \`${NDK}\` |
          | ABI | \`${ABI}\` |
          | Android API level | \`${API}\` |

          ## Assets

          - \`*-soOut.tar.gz\` — native libraries → \`app/src/main/jniLibs/${ABI}\`
          - \`*-jarOut.tar.gz\` — Java libraries → \`app/libs/rcljava\`

          Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          cat RELEASE_NOTES.md

      - name: Release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            ros2-android-*.tar.gz
            SHA256SUMS.txt
