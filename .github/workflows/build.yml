name: Build ROS 2 Android libraries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ros2java-android-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workspace
        run: python3 run.py out/soOut out/jarOut

      - name: Package outputs
        run: |
          tar -C out -czf ros2-android-soOut.tar.gz soOut
          tar -C out -czf ros2-android-jarOut.tar.gz jarOut

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ros2-android-libs-${{ github.sha }}
          path: |
            ros2-android-soOut.tar.gz
            ros2-android-jarOut.tar.gz
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ros2-android-soOut.tar.gz
            ros2-android-jarOut.tar.gz
